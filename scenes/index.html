<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lembas Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Alegreya+Sans:wght@500&display=swap" rel="stylesheet">
<style>
/* Lembas for Windows — the four Middle-earth scenes as a living desktop.
   Works as a Lively Wallpaper (with settings), or open it in any browser.
   ?theme=shire|redbook|starlit|elven  ?still=1  ?clock=0  ?preview=1 */
:root{color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:#05070F}
body{font-family:'Cormorant Garamond',Georgia,serif}
.layer{position:absolute;inset:0;opacity:0;transition:opacity 2.4s ease}
.layer.on{opacity:1}
.layer svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ----- shared motion ----- */
.tw{transform-box:fill-box;transform-origin:center;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.6)}45%{opacity:1;transform:scale(1.3)}60%{opacity:.85;transform:scale(1)}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp ease-in-out infinite}
@keyframes sp{0%,100%{opacity:.2;transform:scale(.35) rotate(0)}50%{opacity:1;transform:scale(1) rotate(20deg)}}
.shoot{animation:shoot 11s linear infinite 3s;opacity:0}
@keyframes shoot{0%,86%{opacity:0;transform:translate(0,0)}88%{opacity:1}96%{opacity:0;transform:translate(-560px,250px)}100%{opacity:0}}
.mist{animation:drift 32s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.moonglow{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.candle{transform-box:fill-box;transform-origin:center;animation:candle 20s ease-in-out infinite}
@keyframes candle{0%{transform:translate(-60px,-30px) scale(1)}33%{transform:translate(50px,20px) scale(1.05)}66%{transform:translate(-20px,40px) scale(.97)}100%{transform:translate(-60px,-30px) scale(1)}}
.mote{animation:mote linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.7}85%{opacity:.7}100%{transform:translate(60px,-300px);opacity:0}}
.needle{transform-box:view-box;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite}
.flame2{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out -.5s infinite}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.94,1.08) skewX(-3deg)}45%{transform:scale(1.04,.92) skewX(2deg)}70%{transform:scale(.97,1.05) skewX(-1deg)}}
.wisp{animation:wisp 4.2s ease-out infinite}
@keyframes wisp{0%{transform:translate(0,0) scaleX(.6);opacity:0}18%{opacity:.75}100%{transform:translate(18px,-170px) scaleX(1.3);opacity:0}}
.fglow{animation:fglow 2.2s ease-in-out infinite}
@keyframes fglow{0%,100%{opacity:.55}50%{opacity:.85}}
.shim{stroke-dasharray:.06 1.3;animation:shim 8s linear 1s infinite}
@keyframes shim{from{stroke-dashoffset:1.15}to{stroke-dashoffset:-.15}}
.halo{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
.emote{animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}80%{opacity:.6}100%{transform:translateY(-420px);opacity:0}}
.cloud{animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(-400px)}to{transform:translateX(2400px)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 4.5s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.55}100%{transform:translate(60px,-200px) scale(1.8);opacity:0}}
.rays{transform-box:fill-box;transform-origin:center;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tree{transform-box:fill-box;transform-origin:50% 100%;animation:treesway 7s ease-in-out infinite}
@keyframes treesway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}

/* ----- entrance (on sign-in) ----- */
.enter .layer.on svg{animation:settle .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes settle{from{transform:scale(1.06)}to{transform:none}}
.enter #clock > *{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.enter #clock > :nth-child(1){animation-delay:.15s}
.enter #clock > :nth-child(2){animation-delay:.22s}
.enter #clock > :nth-child(3){animation-delay:.32s}
.enter #clock > :nth-child(4){animation-delay:.38s}
.enter #clock > :nth-child(5){animation-delay:.46s}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* Layer renders for the native Lembas Desktop: Lb back, Lm middle, Lf front; Ln = drawn live by the app */
body.lay-back .Lm,body.lay-back .Lf,body.lay-back .Ln,body.lay-mid .Lb,body.lay-mid .Lf,body.lay-mid .Ln,body.lay-front .Lb,body.lay-front .Lm,body.lay-front .Ln{display:none}
body.lay-mid,body.lay-front,html.lay-clear{background:transparent}
body.still *,body.noanim *{animation-play-state:paused !important}
body.still .shoot,body.still .shim,body.still .wisp,body.still .mote,body.still .emote{display:none}
@media (prefers-reduced-motion: reduce){*{animation-play-state:paused !important}}

/* ----- clock block ----- */
#clock{position:absolute;display:flex;flex-direction:column;gap:.4vh;z-index:3;pointer-events:none}
#clock.hidden{display:none}
#clock.pos-centre{left:0;right:0;top:15vh;align-items:center;text-align:center}
#clock.pos-left{left:9vw;top:13vh;align-items:flex-start;text-align:left}
#clock.pos-right{right:9vw;top:13vh;align-items:flex-end;text-align:right}
#c-label{font-family:Cinzel,serif;font-size:1.6vh;letter-spacing:.32em}
#c-time{font-size:15vh;font-weight:300;line-height:1;letter-spacing:-.01em}
#c-time small{font-size:.28em;margin-left:.3em}
#c-shire{font-size:3.1vh;font-style:italic;margin-top:1vh}
#c-date{font-size:2vh;letter-spacing:.04em}
#c-meal{font-size:2.4vh;font-style:italic;margin-top:2.6vh}

.t-starlit #clock{color:#F3EBD6}
.t-starlit #c-label,.t-starlit #c-shire{color:#D9BC7A}
.t-starlit #c-date{color:#B9B19C}
.t-starlit #c-time{text-shadow:0 .3vh 2vh rgba(0,0,0,.6)}

.t-redbook #clock{color:#2B1E12;font-family:'IM Fell English',Georgia,serif}
.t-redbook #c-label{font-family:'IM Fell English SC',serif;color:#9A2A1C;font-size:2.2vh;letter-spacing:.24em}
.t-redbook #c-time{font-weight:400;font-size:16vh}
.t-redbook #c-time .first{color:#9A2A1C}
.t-redbook #c-shire{font-size:3.6vh}
.t-redbook #c-date{color:#6A5236}
.t-redbook #c-meal{color:#9A2A1C;font-size:2.8vh}

.t-elven #clock{color:#E6ECEE}
.t-elven #c-label{color:#8E9A9E;letter-spacing:.4em;font-size:1.5vh}
.t-elven #c-time{font-size:13vh}
.t-elven #c-shire{color:#C4D2D6;font-size:2.8vh}
.t-elven #c-date{font-family:Cinzel,serif;color:#8E9A9E;font-size:1.5vh;letter-spacing:.2em}
.t-elven #c-meal{color:#A9C6D6;font-weight:300;margin-top:7vh}
.t-elven #clock.pos-centre{top:27vh}

.t-shire #clock{color:#2F4A2A;font-family:Fraunces,Georgia,serif}
.t-shire #c-label{font-family:'Alegreya Sans',sans-serif;font-weight:500;color:#6A7D4E;letter-spacing:.18em;font-size:1.8vh}
.t-shire #c-time{font-size:14vh;letter-spacing:-.03em}
.t-shire #c-time small{color:#6A7D4E;font-weight:500}
.t-shire #c-date{font-family:'Alegreya Sans',sans-serif;font-weight:500;color:#6A7D4E}
.t-shire #c-meal{display:inline-block;padding:.7vh 1.8vh;border-radius:99px;background:rgba(255,255,255,.6);font-size:2.2vh}

#switcher{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;display:none;gap:6px;padding:6px;border-radius:999px;background:rgba(10,12,20,.55);backdrop-filter:blur(8px)}
#switcher button{font:500 13px/1 'Alegreya Sans',system-ui,sans-serif;color:#EDE3CB;background:transparent;border:1px solid rgba(237,227,203,.25);border-radius:999px;padding:10px 14px;cursor:pointer}
#switcher button[aria-pressed="true"]{background:#EDE3CB;color:#141413}
#switcher button:focus-visible{outline:2px solid #D9BC7A;outline-offset:2px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="clock" class="pos-centre">
  <div id="c-label"></div>
  <div id="c-time"></div>
  <div id="c-shire"></div>
  <div id="c-date"></div>
  <div id="c-meal"></div>
</div>
<div id="switcher" role="group" aria-label="Preview a theme">
  <button data-t="adaptive">Adaptive</button>
  <button data-t="shire">Shire Morning</button>
  <button data-t="redbook">Red Book</button>
  <button data-t="starlit">Starlit Night</button>
  <button data-t="elven">Elven Silver</button>
</div>
<script>
(function () {
'use strict';
var q = new URLSearchParams(location.search);
var cfg = {
  theme: q.get('theme') || 'adaptive',
  clock: q.get('clock') !== '0',
  clockPos: 'default',
  anim: true,
  lat: -33.87, lon: 151.21, // only used for previews; the installer sets your own
  h24: false,
  meals: true
};
var STILL = q.has('still');
var PREVIEW = q.has('preview') || document.documentElement.getAttribute('data-preview') === '1';
if (STILL) document.body.classList.add('still');
var LAYER = q.get('layer');   // back | mid | front: the still layers the Lembas Desktop app animates between
if (LAYER) { document.body.classList.add('lay-' + LAYER); if (LAYER !== 'back') document.documentElement.classList.add('lay-clear'); }

// ------------------------------------------------------------------ sun & schedule
function sunDay(date) {
  var start = new Date(date.getFullYear(), 0, 1);
  var n = Math.floor((date - start) / 864e5) + 1;
  var g = 2 * Math.PI / 365 * (n - 1);
  var eot = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  var noonDate = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  var off = -noonDate.getTimezoneOffset();
  var noon = 720 - 4 * cfg.lon - eot + off;
  var lat = cfg.lat * Math.PI / 180;
  var cosHa = Math.cos(90.833 * Math.PI / 180) / (Math.cos(lat) * Math.cos(dec)) - Math.tan(lat) * Math.tan(dec);
  var ha = cosHa >= 1 ? 0 : cosHa <= -1 ? 180 : Math.acos(cosHa) * 180 / Math.PI;
  return { rise: noon - 4 * ha, noon: noon, set: noon + 4 * ha };
}
function adaptive(now) {
  var d = sunDay(now), m = now.getHours() * 60 + now.getMinutes();
  if (m >= d.rise && m < d.noon) return 'shire';
  if (m >= d.noon && m < d.set) return 'redbook';
  if (m >= 23 * 60 || m < 4 * 60) return 'elven';
  return 'starlit';
}
function currentTheme(now) { return cfg.theme === 'adaptive' ? adaptive(now) : cfg.theme; }

// ------------------------------------------------------------------ lore
var MONTHS = ['Afteryule', 'Solmath', 'Rethe', 'Astron', 'Thrimidge', 'Forelithe', 'Afterlithe', 'Wedmath', 'Halimath', 'Winterfilth', 'Blotmath', 'Foreyule'];
var WEEK = ['Sunday', 'Monday', 'Trewsday', 'Hevensday', 'Mersday', 'Highday', 'Sterday'];
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
function shireDate(date) {
  var y = date.getFullYear();
  var after = date.getMonth() === 11 && date.getDate() >= 21;
  var start = Date.UTC(after ? y : y - 1, 11, 21);
  var d = Math.round((Date.UTC(y, date.getMonth(), date.getDate()) - start) / 864e5);
  var leap = isLeap((after ? y : y - 1) + 1);
  if (d === 0) return { day: 0, name: '1 Yule' };
  if (d === 1) return { day: 0, name: '2 Yule' };
  d -= 2;
  if (d < 180) return { day: d % 30 + 1, name: MONTHS[Math.floor(d / 30)] };
  d -= 180;
  var lithe = leap ? ['1 Lithe', "Mid-year's Day", 'Overlithe', '2 Lithe'] : ['1 Lithe', "Mid-year's Day", '2 Lithe'];
  if (d < lithe.length) return { day: 0, name: lithe[d] };
  d -= lithe.length;
  if (d < 180) return { day: d % 30 + 1, name: MONTHS[6 + Math.floor(d / 30)] };
  return { day: 0, name: '1 Yule' };
}
function ordinal(n) { var s = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'); return n + s; }
function period(h) {
  if (h >= 4 && h <= 6) return ['Tindómë', 'the star-dawn'];
  if (h >= 7 && h <= 17) return ['Aurë', 'the day'];
  if (h >= 18 && h <= 20) return ['Undómë', 'eventide'];
  return ['Lómë', 'the night'];
}
function meal(h) {
  if (h === 5 || h === 6) return 'Kettle on';
  if (h === 7 || h === 8) return 'Breakfast';
  if (h === 9 || h === 10) return 'Second breakfast';
  if (h === 11) return 'Elevenses';
  if (h === 12 || h === 13) return 'Luncheon';
  if (h === 14) return 'A stroll in the garden';
  if (h === 15 || h === 16) return 'Afternoon tea';
  if (h === 17) return 'A pint at the Green Dragon';
  if (h === 18 || h === 19) return 'Dinner';
  if (h === 20 || h === 21) return 'Supper';
  return 'The Shire sleeps';
}
function occasion(d) {
  var k = (d.getMonth() + 1) + '-' + d.getDate();
  return { '1-3': "The Professor's birthday", '3-25': 'Tolkien Reading Day', '9-22': 'Hobbit Day' }[k] || null;
}
var fmt = function (d, o) { return d.toLocaleDateString(undefined, o); };

function renderClock(theme, now) {
  var el = document.getElementById('clock');
  el.className = cfg.clock ? '' : 'hidden';
  var pos = cfg.clockPos === 'default' ? (theme === 'shire' ? 'left' : 'centre') : cfg.clockPos;
  el.classList.add('pos-' + pos);
  var sd = shireDate(now), wd = WEEK[now.getDay()], p = period(now.getHours()), occ = occasion(now);
  var h = now.getHours(), mi = String(now.getMinutes()).padStart(2, '0');
  var time = cfg.h24 ? h + ':' + mi : ((h % 12) || 12) + ':' + mi;
  var timeHtml = time;
  if (theme === 'redbook') timeHtml = '<span class="first">' + time[0] + '</span>' + time.slice(1);
  if (theme === 'shire' && !cfg.h24) timeHtml = time + '<small>' + (h < 12 ? 'am' : 'pm') + '</small>';
  var shireTxt = sd.day ? sd.day + ' ' + sd.name : sd.name;
  var greg = fmt(now, { weekday: 'long', day: 'numeric', month: 'long' }) + (occ ? ' · ' + occ : '');
  var label, shire, date, mealTxt = cfg.meals ? meal(h) : '';
  if (theme === 'redbook') {
    label = wd;
    shire = sd.day ? ordinal(sd.day) + ' of ' + sd.name : sd.name;
    date = fmt(now, { weekday: 'long' }) + ', the ' + ordinal(now.getDate()) + ' of ' + fmt(now, { month: 'long' }) + (occ ? ' · ' + occ : '');
    if (mealTxt && /Breakfast|breakfast|Elevenses|Luncheon|tea|Dinner|Supper/.test(mealTxt)) mealTxt = 'Time for ' + mealTxt.charAt(0).toLowerCase() + mealTxt.slice(1);
  } else if (theme === 'elven') {
    label = p[0].toUpperCase(); shire = wd + ' · ' + shireTxt; date = greg.toUpperCase();
  } else if (theme === 'shire') {
    label = (wd + ' · ' + p[0]).toUpperCase(); shire = shireTxt; date = greg;
  } else {
    label = (p[0] + ' · ' + p[1]).toUpperCase(); shire = wd + ', ' + shireTxt; date = greg;
  }
  document.getElementById('c-label').textContent = label;
  document.getElementById('c-time').innerHTML = timeHtml;
  document.getElementById('c-shire').textContent = shire;
  document.getElementById('c-date').textContent = date;
  var m = document.getElementById('c-meal');
  m.textContent = mealTxt;
  m.style.display = mealTxt ? '' : 'none';
}

// ------------------------------------------------------------------ scenes (1920×1080 artboards)
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function f(n) { return Math.round(n * 10) / 10; }
var SPARK = 'M0,-9 L1.4,-1.4 L9,0 L1.4,1.4 L0,9 L-1.4,1.4 L-9,0 L-1.4,-1.4 Z';

function ridge(r, baseY, amp, stepMin, stepMax) {
  var d = 'M0,1080 L0,' + f(baseY - amp * .2), x = 0, y = baseY - amp * .2, peak = true;
  while (x < 1920) {
    var nx = x + stepMin + r() * (stepMax - stepMin);
    var ny = peak ? baseY - amp * (.35 + r() * .65) : baseY - amp * r() * .3;
    for (var i = 1; i <= 2; i++) { var t = i / 3; d += ' L' + f(x + (nx - x) * t) + ',' + f(y + (ny - y) * t + (r() - .5) * amp * .12); }
    d += ' L' + f(nx) + ',' + f(ny); x = nx; y = ny; peak = !peak;
  }
  return d + ' L1920,1080 Z';
}

function moonPath(cx, cy, rr) {
  var phase = ((Date.now() - 947182440000) / 864e5 / 29.530588853) % 1; if (phase < 0) phase += 1;
  var tw = rr * Math.cos(2 * Math.PI * phase), aw = Math.max(Math.abs(tw), .5);
  var d = 'M' + cx + ',' + (cy - rr) + ' A' + rr + ',' + rr + ' 0 0 1 ' + cx + ',' + (cy + rr) +
    ' A' + f(aw) + ',' + rr + ' 0 0 ' + (tw >= 0 ? 0 : 1) + ' ' + cx + ',' + (cy - rr) + ' Z';
  var flip = (phase > .5) !== (cfg.lat < 0);
  return '<path d="' + d + '" fill="#EFE8D6"' + (flip ? ' transform="translate(' + 2 * cx + ',0) scale(-1,1)"' : '') + '/>';
}

function starlit() {
  var r = rng(1954), s = '';
  s += '<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070F"/><stop offset=".45" stop-color="#0B1226"/><stop offset=".78" stop-color="#1A2444"/><stop offset="1" stop-color="#2A3354"/></linearGradient>' +
    '<radialGradient id="mg"><stop offset="0" stop-color="#CFD8F0" stop-opacity=".28"/><stop offset="1" stop-color="#CFD8F0" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="eg"><stop offset="0" stop-color="#FFF4D8" stop-opacity=".6"/><stop offset="1" stop-color="#FFF4D8" stop-opacity="0"/></radialGradient>' +
    '<linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#FFF4D8" stop-opacity="0"/><stop offset=".5" stop-color="#FFF4D8" stop-opacity=".9"/><stop offset="1" stop-color="#FFF4D8" stop-opacity="0"/></linearGradient>' +
    '<linearGradient id="fv" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFF4D8" stop-opacity="0"/><stop offset=".5" stop-color="#FFF4D8" stop-opacity=".9"/><stop offset="1" stop-color="#FFF4D8" stop-opacity="0"/></linearGradient>' +
    '<linearGradient id="mi" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3A4A72" stop-opacity="0"/><stop offset=".6" stop-color="#3A4A72" stop-opacity=".4"/><stop offset="1" stop-color="#3A4A72" stop-opacity="0"/></linearGradient>' +
    '<linearGradient id="ft" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#05070F" stop-opacity="0"/><stop offset="1" stop-color="#05070F" stop-opacity=".85"/></linearGradient>' +
    '<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFF4D8" stop-opacity=".95"/><stop offset="1" stop-color="#FFF4D8" stop-opacity="0"/></linearGradient></defs>';
  s += '<g class="Lb"><rect width="1920" height="1080" fill="url(#sk)"/>';
  var col = function () { var k = r(); return k < .12 ? '#FFE2B0' : k < .25 ? '#BFD4FF' : '#F4F1E8'; };
  s += '<g>';
  for (var i = 0; i < 300; i++) s += '<circle cx="' + f(r() * 1920) + '" cy="' + f(Math.pow(r(), 1.3) * 760) + '" r="' + f(.5 + Math.pow(r(), 3) * 1.4) + '" fill="' + col() + '" opacity="' + f(.25 + r() * .6) + '"/>';
  s += '</g></g><g class="Ln">';
  for (i = 0; i < 70; i++) s += '<circle class="tw" cx="' + f(r() * 1920) + '" cy="' + f(Math.pow(r(), 1.3) * 720) + '" r="' + f(1 + Math.pow(r(), 3) * 2) + '" fill="' + col() + '" style="animation-duration:' + f(1.8 + r() * 3.4) + 's;animation-delay:-' + f(r() * 6) + 's"/>';
  for (i = 0; i < 10; i++) s += '<path class="sp" d="' + SPARK + '" transform="translate(' + f(60 + r() * 1800) + ',' + f(40 + r() * 600) + ')" fill="#FFF8E6" style="animation-duration:' + f(2.2 + r() * 2.5) + 's;animation-delay:-' + f(r() * 4) + 's;filter:drop-shadow(0 0 4px rgba(255,244,216,.9))"/>';

var SCENES = { starlit: starlit, redbook: redbook, elven: elven, shire: shire };
var shown = null, shownDay = -1;

function showTheme(id, instant) {
  var stage = document.getElementById('stage');
  var layer = document.createElement('div');
  layer.className = 'layer';
  layer.innerHTML = '<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice" aria-hidden="true">' + SCENES[id]() + '</svg>';
  stage.appendChild(layer);
  document.body.className = document.body.className.replace(/\bt-\w+/g, '').trim() + ' t-' + id;
  var old = Array.prototype.slice.call(stage.children, 0, -1);
  if (instant) { layer.style.transition = 'none'; }
  requestAnimationFrame(function () {
    layer.classList.add('on');
    setTimeout(function () { old.forEach(function (o) { o.remove(); }); }, instant ? 0 : 2600);
  });
  shown = id;
  shownDay = new Date().getDate();
  document.querySelectorAll('#switcher button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.t === cfg.theme)); });
}

function tick(force) {
  var now = new Date(), t = currentTheme(now);
  if (force || t !== shown || now.getDate() !== shownDay) showTheme(t, force === 'instant');
  renderClock(t, now);
}

// Lively Wallpaper settings (see LivelyProperties.json)
window.livelyPropertyListener = function (name, val) {
  if (name === 'theme') cfg.theme = ['adaptive', 'shire', 'redbook', 'starlit', 'elven'][val] || 'adaptive';
  else if (name === 'clock') cfg.clock = !!val;
  else if (name === 'clockPosition') cfg.clockPos = ['default', 'left', 'centre', 'right'][val] || 'default';
  else if (name === 'animations') { cfg.anim = !!val; document.body.classList.toggle('noanim', !cfg.anim); }
  else if (name === 'clock24') cfg.h24 = !!val;
  else if (name === 'meals') cfg.meals = !!val;
  else if (name === 'latitude') { var a = parseFloat(val); if (!isNaN(a)) cfg.lat = a; }
  else if (name === 'longitude') { var o = parseFloat(val); if (!isNaN(o)) cfg.lon = o; }
  if (shown) tick(true);
};

if (PREVIEW) {
  var sw = document.getElementById('switcher');
  sw.style.display = 'flex';
  sw.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cfg.theme = b.dataset.t; tick(true);
  });
}

if (!STILL) document.body.classList.add('enter');
tick('instant');
if (!STILL) {
  setTimeout(function () { document.body.classList.remove('enter'); }, 1600);
  setInterval(tick, 15000);
}
})();
