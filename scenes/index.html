<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lembas scenes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Alegreya+Sans:wght@500&display=swap" rel="stylesheet">
<style>
/* Lembas — the four Middle-earth scenes, shared by every Lembas device.
   One drawing, two shapes: fmt=pc (a 2880×1080 panorama; a 16:9 screen shows the middle
   1920, an ultrawide shows more) and fmt=phone (1080×2400, for a tall screen).
   ?theme=shire|redbook|starlit|elven   ?season=spring|summer|autumn|winter (default: today's)
   ?south=0|1 (hemisphere, default 1)   ?fmt=pc|phone   ?clock=1 (a preview clock)
   ?still=1 (no motion)   ?layer=back|mid|front|moving (the still layers the apps animate between)
   Open it in a browser, or use it as a Lively Wallpaper: it animates on its own. */
html,body{margin:0;height:100%;overflow:hidden;background:#05070F}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
html.transparent,html.transparent body{background:transparent}
.still *{animation:none!important}
.still .fall,.still .rise,.still .ember{display:none}
/* motion, for the browser version (the apps draw the same motion themselves) */
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-700px)}to{transform:translateX(3200px)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 5s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.6}100%{transform:translate(50px,-200px) scale(1.9);opacity:0}}
.glint{animation:glint ease-in-out infinite}
@keyframes glint{0%,100%{opacity:0;transform:translateX(-14px)}50%{opacity:.85;transform:translateX(14px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite}
.flame.b{animation-duration:1.05s;animation-delay:-.4s}.flame.c{animation-duration:.8s;animation-delay:-.2s}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.08) skewX(-3deg)}50%{transform:scale(1.04,.93) skewX(2deg)}75%{transform:scale(.97,1.05) skewX(-1deg)}}
.ember{animation:ember linear infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(30px,-260px);opacity:0}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
.flicker{animation:flicker 3.2s steps(1) infinite}
@keyframes flicker{0%,100%{opacity:1}31%{opacity:.82}33%{opacity:1}64%{opacity:.88}67%{opacity:1}}
.fall{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-120px);opacity:0}20%{opacity:.9}to{transform:translateY(520px);opacity:0}}
.lamp{transform-box:fill-box;transform-origin:center;animation:lamp ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.6;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.rise{animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-360px);opacity:0}}
.mist{animation:mist 40s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.needle{transform-box:fill-box;transform-origin:center;animation:needle 7s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}
.clock{font-family:'Fraunces',serif}
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') === 'phone' ? 'phone' : 'pc';
const SOUTH = q.get('south') !== '0';
function seasonToday() {
  const m = new Date().getMonth(); // 0..11
  const north = ['winter','winter','spring','spring','spring','summer','summer','summer','autumn','autumn','autumn','winter'][m];
  const flip = { winter:'summer', summer:'winter', spring:'autumn', autumn:'spring' };
  return SOUTH ? flip[north] : north;
}
const SEASON = q.get('season') || seasonToday();
const THEME = q.get('theme') || 'shire';
const LAYER = q.get('layer');       // only this still layer (transparent elsewhere)
const STILL = q.has('still');
const CLOCK = q.get('clock') === '1';
if (STILL) document.body.classList.add('still');
if (LAYER && LAYER !== 'back') document.documentElement.classList.add('transparent');

// The drawing area. PC: the 1920×1080 design, with 480 more on each side for wide screens.
const PC = FMT === 'pc';
const W = PC ? 1920 : 1080, H = PC ? 1080 : 2400;
const X0 = PC ? -480 : 0, X1 = PC ? 2400 : 1080;
const svg = document.getElementById('art');
svg.setAttribute('viewBox', `${X0} 0 ${X1 - X0} ${H}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMax slice');

// Still layers: back (sky and far land), mid (in front of the clouds and sun), front (the
// foreground). Moving parts, which the apps animate themselves (drawn here for the browser), sit
// at three depths: under (behind mid), moving (between mid and front) and over (above it all).
const L = { defs: '', back: '', under: '', mid: '', moving: '', front: '', over: '' };
const add = (layer, s) => { L[layer] += s; };
const def = s => { L.defs += s; };

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f1 = v => (Math.round(v * 10) / 10);
function hill(base, amp, seed, bottom = H + 10) {
  const r = rng(seed);
  const k = [...Array(4)].map((_, i) => ({ f: (0.6 + r() * 1.4) * (i + 1) / W * Math.PI * 2, p: r() * 7, a: amp / (i + 1.2) }));
  let d = `M${X0 - 20},${bottom}`;
  for (let x = X0 - 20; x <= X1 + 20; x += 12) { let y = base; for (const c of k) y += Math.sin(x * c.f + c.p) * c.a; d += ` L${x},${f1(y)}`; }
  return d + ` L${X1 + 20},${bottom} Z`;
}
function mountains(base, amp, seed, rough, peaks) {
  const r = rng(seed), n = 257, ys = new Array(n).fill(0);
  ys[0] = r() * amp; ys[n - 1] = r() * amp;
  let step = n - 1, sc = amp;
  while (step > 1) { for (let i = 0; i + step < n; i += step) { const m = i + step / 2; ys[m] = (ys[i] + ys[i + step]) / 2 + (r() - 0.5) * sc * 2; } step /= 2; sc *= rough; }
  const span = X1 - X0 + 40;
  for (const [px, ph, pw] of peaks) for (let i = 0; i < n; i++) { const x = X0 - 20 + i / (n - 1) * span; ys[i] += ph * Math.max(0, 1 - Math.abs(x - px) / pw); }
  let d = `M${X0 - 20},${H + 10} `;
  ys.forEach((v, i) => { d += `L${f1(X0 - 20 + i / (n - 1) * span)},${f1(base - v)} `; });
  return d + `L${X1 + 20},${H + 10} Z`;
}
const grainDef = `<filter id="grain" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>`;
// film grain goes on the back layer only, so the see-through layers stay small and clean
const grain = (layer, o) => add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" filter="url(#grain)" opacity="${o}"/>`);
const at = (x, y, s, body) => `<g transform="translate(${x},${y}) scale(${s})">${body}</g>`;

// Where things sit, per format (x, y, scale), so the apps can place the moving parts too.
const P = PC ? {
  sun: [1390, 250, 1], tree: [470, 600, 1], door: [1240, 905, 1], chimney: [1389, 826], river: 760,
  fire: [1210, 930, 1], compass: [1760, 900, 1], moon: [1480, 230, 54], lakeY: 790, glint: [1480, 812],
  cabin: [600, 905], star: [1160, 150, 1], clock: [150, 150],
} : {
  sun: [830, 900, 1], tree: [220, 1380, 1.25], door: [740, 1880, 1.6], chimney: [893, 1736], river: 1560,
  fire: [560, 1860, 1.5], compass: [900, 1900, 1], moon: [820, 960, 64], lakeY: 1760, glint: [820, 1786],
  cabin: [430, 1960], star: [540, 140, 1.2], clock: [540, 300],
};

// ================================================================ Shire Morning
function shire() {
  const S = SEASON;
  const pal = {
    spring: { hills: ['#C9DDB3', '#AFCD96', '#93BC7C', '#79A866', '#6E9C55', '#4F8043'], tree: ['#7DAE5E', '#93BF72', '#F2B8C6'], flowers: ['#F4B6C7', '#FFFFFF', '#F5D36B', '#D98BB0'], sky: ['#C3E3E2', '#E9F0DF', '#FCF0D6'] },
    summer: { hills: ['#C3D7AE', '#A9C793', '#8DB677', '#79A35F', '#6E9A56', '#4E7E42'], tree: ['#6A9850', '#7DAA5F', '#86B266'], flowers: ['#F0A27E', '#F5D36B', '#FFFFFF', '#D98BB0'], sky: ['#BFE0E0', '#E7EEDD', '#FCEFD2'] },
    autumn: { hills: ['#D6D2A2', '#C3BE84', '#A9AE6A', '#9A9C58', '#8D8C4E', '#6E7440'], tree: ['#D9843A', '#E8A646', '#C8562E'], flowers: ['#E8A646', '#C8562E', '#F5D36B', '#B8743A'], sky: ['#CFE0DE', '#F0E9D6', '#FBE3C2'] },
    winter: { hills: ['#E9EEF0', '#DCE6E8', '#CCDADB', '#BACDCC', '#AFC4C2', '#8FA9A6'], tree: ['#C7D6D6', '#E6EEEF', '#FFFFFF'], flowers: ['#FFFFFF', '#FFFFFF', '#E9F2F4', '#FFFFFF'], sky: ['#C6D8E4', '#E4EAF0', '#F3EFE6'] },
  }[S];
  def(`${grainDef}<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[0]}"/><stop offset="${PC ? .45 : .35}" stop-color="${pal.sky[1]}"/><stop offset="${PC ? .72 : .55}" stop-color="${pal.sky[2]}"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".28" stop-color="#FFEFC0"/><stop offset=".29" stop-color="#FFE7A6" stop-opacity=".55"/><stop offset="1" stop-color="#FFE7A6" stop-opacity="0"/></radialGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${S === 'winter' ? '#DDEBEE' : '#CFE7E4'}"/><stop offset="1" stop-color="${S === 'winter' ? '#BFD8DE' : '#A9D3D3'}"/></linearGradient>
  <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[2]}" stop-opacity="0"/><stop offset="1" stop-color="${pal.sky[2]}" stop-opacity=".75"/></linearGradient>`);
  add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" fill="url(#sky)"/>`);
  // sun and clouds move (drawn by the apps); here for the browser
  const [sx, sy] = P.sun;
  add('under', `<circle class="pulse" cx="${sx}" cy="${sy}" r="300" fill="url(#sun)"/>`);
  const cloud = (x, y, s, o, dur) => add('under', `<g class="drift" style="animation-duration:${dur}s;animation-delay:-${(x + 700) / 3900 * dur}s"><g transform="translate(${x},${y}) scale(${s})" fill="#fff" opacity="${o}"><rect x="-90" y="-8" width="200" height="34" rx="17"/><circle cx="-30" cy="-6" r="32"/><circle cx="20" cy="-22" r="42"/><circle cx="66" cy="-2" r="26"/></g></g>`);
  if (PC) { cloud(1640, 190, 1, .9, 260); cloud(980, 140, .7, .75, 320); cloud(1240, 420, .55, .8, 380); cloud(320, 470, .6, .7, 300); cloud(-260, 260, .8, .8, 340); }
  else { cloud(180, 900, .9, .85, 220); cloud(900, 1150, .7, .8, 280); cloud(520, 780, .5, .7, 340); }
  const b = PC ? 0 : 740;  // the phone's land starts lower
  add('mid', `<path d="${hill(560 + b, PC ? 22 : 26, 3)}" fill="${pal.hills[0]}"/><rect x="${X0}" y="${520 + b}" width="${X1 - X0}" height="120" fill="url(#haze)"/>
  <path d="${hill(610 + b, PC ? 28 : 30, 9)}" fill="${pal.hills[1]}"/><path d="${hill(660 + b, 34, 21)}" fill="${pal.hills[2]}"/>`);
  if (S === 'winter') add('mid', `<path d="${hill(566 + b, PC ? 22 : 26, 3)}" fill="#FFFFFF" opacity=".55"/>`);
  // the Party Tree
  const [tx, ty, ts] = P.tree, tc = pal.tree;
  add('mid', at(tx, ty, ts, `<g class="sway"><rect x="-5" y="-20" width="10" height="64" rx="4" fill="#5B4A33"/>` +
    (S === 'winter'
      ? `<path d="M0,-10 L-30,-70 M0,-30 L28,-84 M0,-50 L-8,-104 M-18,-46 L-48,-60 M16,-60 L44,-58" stroke="#5B4A33" stroke-width="5" stroke-linecap="round"/><g fill="#FFFFFF" opacity=".9"><circle cx="-30" cy="-72" r="6"/><circle cx="28" cy="-86" r="6"/><circle cx="-8" cy="-106" r="6"/><circle cx="44" cy="-60" r="5"/><circle cx="-48" cy="-62" r="5"/></g>`
      : `<circle cx="0" cy="-58" r="52" fill="${tc[0]}"/><circle cx="-44" cy="-30" r="34" fill="${tc[0]}"/><circle cx="46" cy="-32" r="38" fill="${tc[0]}"/><circle cx="10" cy="-78" r="34" fill="${tc[1]}"/><circle cx="-22" cy="-62" r="22" fill="${tc[2]}"/>` +
        (S === 'spring' ? [...Array(16)].map((_, i) => { const r = rng(90 + i); return `<circle cx="${f1(-60 + r() * 120)}" cy="${f1(-110 + r() * 90)}" r="${f1(3 + r() * 3)}" fill="${i % 2 ? '#F2B8C6' : '#FFFFFF'}"/>`; }).join('') : '')) +
    `</g>`));
  // the river
  const rv = P.river;
  add('mid', PC
    ? `<path d="M${X0 - 20},${rv} C300,720 520,800 820,770 S1300,700 1500,735 S1800,790 ${X1 + 20},${rv} L${X1 + 20},${rv + 30} C1700,820 1520,770 1300,770 S860,830 600,820 S200,770 ${X0 - 20},${rv + 40} Z" fill="url(#river)"/>`
    : `<path d="M-20,${rv} C200,1520 420,1600 640,1570 S960,1500 1100,1540 L1100,1580 C940,1550 820,1610 640,1610 S220,1570 -20,1600 Z" fill="url(#river)"/>`);
  const glints = PC ? [[140, 775, 70], [520, 792, 40], [1010, 771, 90], [1560, 752, 50], [-300, 768, 60], [2100, 770, 70]] : [[120, 1572, 60], [560, 1590, 40], [900, 1548, 50]];
  glints.forEach(([x, y, w], i) => add('moving', `<path class="glint" style="animation-duration:${4 + i % 3}s;animation-delay:-${i * 1.3}s" d="M${x},${y} h${w}" stroke="#fff" stroke-width="${PC ? 3 : 4}" stroke-linecap="round"/>`));
  // the hill with the round doors
  if (PC) add('front', `<path d="M820,1090 C900,860 1080,790 1320,790 C1560,790 1760,850 ${X1 + 20},900 L${X1 + 20},1090 Z" fill="${pal.hills[4]}"/>
    <path d="M${X0 - 20},1090 L${X0 - 20},870 C-200,860 0,850 200,850 C420,860 640,900 760,925 C860,980 900,1090 900,1090 Z" fill="${pal.hills[3]}"/>`);
  else add('front', `<path d="M260,2410 C320,1880 520,1720 760,1710 C900,1704 1020,1740 1100,1780 L1100,2410 Z" fill="${pal.hills[4]}"/>
    <path d="M-20,2410 L-20,1820 C120,1780 260,1800 380,1860 C460,1900 520,2000 540,2410 Z" fill="${pal.hills[3]}"/>`);
  // (winter: the hills' palette is already snowy)
  const door = (x, y, r, c, win) => {
    add('front', `<circle cx="${x}" cy="${y}" r="${r + r * 0.2}" fill="#D9C08E"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${r * 0.12}" fill="#E8B84A"/><path d="M${x - r},${y} h${2 * r} M${x},${y - r} v${2 * r}" stroke="#000" stroke-opacity=".12" stroke-width="${r / 20}"/>`);
    if (win) add('front', `<circle cx="${x + win}" cy="${y - r * 0.18}" r="${r * 0.38}" fill="#D9C08E"/><circle cx="${x + win}" cy="${y - r * 0.18}" r="${r * 0.27}" fill="#FFF1C4"/><path d="M${x + win - r * 0.27},${y - r * 0.18} h${r * 0.54} M${x + win},${y - r * 0.45} v${r * 0.54}" stroke="#D9C08E" stroke-width="${r / 16}"/>`);
  };
  const [dx, dy, ds] = P.door;
  door(dx, dy, 44 * ds, '#2F6B42', -92 * ds);
  if (PC) { door(1560, 935, 30, '#E2B64A', 64); door(-160, 930, 28, '#3A6E9A', 56); door(2160, 950, 26, '#B4532F', -52); }
  const [cx, cy] = P.chimney, cs = PC ? 1 : 1.45;
  add('front', `<rect x="${cx - 9 * cs}" y="${cy}" width="${18 * cs}" height="${40 * cs}" rx="3" fill="#7A6247"/>`);
  for (let k = 0; k < 4; k++) add('over', STILL
    ? `<circle cx="${cx + 3 * cs + k * 14 * cs}" cy="${cy - 20 * cs - k * 40 * cs}" r="${(9 + k * 5) * cs}" fill="#fff" opacity="${.55 - k * .11}"/>`
    : `<circle class="smoke" style="animation-delay:-${k * 1.25}s" cx="${cx + 3 * cs}" cy="${cy - 20 * cs}" r="${(10 + k * 3) * cs}" fill="#fff" opacity=".5"/>`);
  add('front', PC ? `<path d="M1060,1090 C1120,1020 1180,975 1240,955" stroke="#E2CC9A" stroke-width="22" fill="none" stroke-linecap="round"/>`
                  : `<path d="M560,2050 C620,1990 680,1970 740,1962" stroke="#E2CC9A" stroke-width="30" fill="none" stroke-linecap="round"/>`);
  if (PC) add('front', `<path d="M640,905 q30,-34 60,0 q30,-30 60,2 q26,-28 52,6 v20 h-172 z" fill="${pal.hills[5]}"/>`);
  const r = rng(5), n = S === 'spring' ? 80 : S === 'winter' ? 0 : 46;
  for (let i = 0; i < n; i++) {
    const x = PC ? 900 + r() * 1400 : 380 + r() * 700, y = PC ? 960 + r() * 110 : 1900 + r() * 130;
    add('front', `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1((3 + r() * 2.5) * (PC ? 1 : 1.3))}" fill="${pal.flowers[i % 4]}"/>`);
  }
  if (S === 'autumn') for (let i = 0; i < 40; i++) { const x = f1(X0 + r() * (X1 - X0)), y = f1(PC ? 960 + r() * 110 : 1900 + r() * 200); add('front', `<ellipse cx="${x}" cy="${y}" rx="6" ry="3" fill="${pal.tree[i % 3]}" transform="rotate(${f1(r() * 180)} ${x} ${y})"/>`); }
  add('front', `<path d="${hill(PC ? 1030 : 2060, 14, 77)}" fill="${pal.hills[5]}"/>`);
  if (S !== 'winter') for (let i = 0; i < (PC ? 160 : 60); i++) { const x = X0 + r() * (X1 - X0), h = 14 + r() * 26, y0 = PC ? 1040 : 2072; add('front', `<path d="M${f1(x)},${y0} q3,-${f1(h)} 7,-${f1(h + 4)} q-1,${f1(h * 0.6)} 2,${f1(h + 4)}z" fill="${S === 'autumn' ? '#7E7A3E' : '#456F3A'}"/>`); }
  grain('front', .7);
  return { ink: ['#27452A', '#3E6A3A', '#55703F'] };
}

// ================================================================ Red Book
function redbook() {
  const ink = '#5A3F22', red = '#9A2A1C', S = SEASON;
  def(`${grainDef}<radialGradient id="pap" cx=".5" cy=".42" r=".8"><stop offset="0" stop-color="#F6ECD2"/><stop offset=".6" stop-color="#EDDDB8"/><stop offset="1" stop-color="#D8C192"/></radialGradient>
  <radialGradient id="fire"><stop offset="0" stop-color="#FFB25B" stop-opacity=".55"/><stop offset="1" stop-color="#FFB25B" stop-opacity="0"/></radialGradient>
  <filter id="rough"><feTurbulence baseFrequency=".03" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>`);
  add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" fill="url(#pap)"/><g filter="url(#rough)" fill="none" stroke="${ink}" stroke-linecap="round">`);
  if (PC) add('back', `<path d="M1500,-10 C1460,140 1560,240 1500,360 S1400,560 1480,700 S1600,900 1540,1090" stroke-width="3.2" stroke-opacity=".75"/>
    <path d="M1512,-10 C1474,140 1574,240 1514,360 S1414,560 1494,700 S1614,900 1554,1090" stroke-width="1.2" stroke-opacity=".45"/>
    <path d="M${X0},610 C-200,600 0,590 300,590 C520,640 760,600 760,600 S1180,560 1490,590 S1800,640 ${X1},620" stroke="${red}" stroke-width="2.4" stroke-dasharray="14 10" stroke-opacity=".8"/>
    <path d="M-420,200 C-300,260 -200,240 -120,300 S20,420 60,500" stroke-width="2.4" stroke-opacity=".55"/>`);
  else add('back', `<path d="M820,820 C780,980 900,1100 840,1260 S720,1520 800,1700 S940,1960 880,2410" stroke-width="4" stroke-opacity=".75"/>
    <path d="M834,820 C794,980 914,1100 854,1260 S734,1520 814,1700 S954,1960 894,2410" stroke-width="1.5" stroke-opacity=".45"/>
    <path d="M-10,1380 C240,1350 420,1420 600,1380 S900,1330 1090,1370" stroke="${red}" stroke-width="3" stroke-dasharray="18 12" stroke-opacity=".8"/>`);
  const r = rng(11), k = PC ? 1 : 1.25;
  const hm = (x, y, s) => add('back', `<path d="M${x - s},${y} q${s},-${s * 1.1} ${2 * s},0" stroke-width="${2 * k}" stroke-opacity=".7"/><path d="M${x - s * .4},${y - s * .35} l-${s * .25},${s * .35} M${x},${y - s * .55} l-${s * .25},${s * .55} M${x + s * .4},${y - s * .35} l-${s * .2},${s * .35}" stroke-width="${1.2 * k}" stroke-opacity=".5"/>`);

  const [mx, my, mr] = P.moon;

  }

                  : `<path d="M-20,2410 L-20,1880 C160,1850 360,1870 520,1930 C600,1960 660,2040 680,2410 Z" fill="${shore}"/>`);
  const pine = (x, y, h) => add('front', `<path d="M${f1(x)},${f1(y - h)} l${f1(h * .22)},${f1(h * .38)} h-${f1(h * .1)} l${f1(h * .28)},${f1(h * .36)} h-${f1(h * .12)} l${f1(h * .3)},${f1(h * .32)} h-${f1(h * 1.16)} l${f1(h * .3)},-${f1(h * .32)} h-${f1(h * .12)} l${f1(h * .28)},-${f1(h * .36)} h-${f1(h * .1)}z" fill="${pineC}"/>` +

  def(`${grainDef}<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06090C"/><stop offset=".6" stop-color="#0E1A20"/><stop offset="1" stop-color="#173039"/></linearGradient>
  <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDF2F6" stop-opacity=".9"/><stop offset="1" stop-color="#DDF2F6" stop-opacity="0"/></linearGradient>

  <radialGradient id="lampglow"><stop offset="0" stop-color="#F3E3B4" stop-opacity=".45"/><stop offset="1" stop-color="#F3E3B4" stop-opacity="0"/></radialGradient>
  <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FC7D0" stop-opacity="0"/><stop offset=".5" stop-color="#9FC7D0" stop-opacity=".22"/><stop offset="1" stop-color="#9FC7D0" stop-opacity="0"/></linearGradient>
  <linearGradient id="knoll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S === 'winter' ? '#C9D8DC' : '#2E5A57'}"/><stop offset="${PC ? .08 : .06}" stop-color="${S === 'winter' ? '#8FA9AE' : '#1D3D3C'}"/><stop offset="1" stop-color="#0E1E20"/></linearGradient>`);
  add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" fill="url(#sky)"/>`);

  const [sx, sy, ss] = P.star;
  add('under', `<circle class="pulse" cx="${sx}" cy="${sy}" r="${90 * ss}" fill="url(#glow)"/>`);
  add('back', at(sx, sy, ss, `<path d="M0,-40 l7,33 33,7 -33,7 -7,33 -7,-33 -33,-7 33,-7z" fill="#F2FAFC"/>`));
  if (PC) add('back', `<path d="M${X0 - 20},1090 L${X0 - 20},180 C-300,200 -100,260 0,240 C80,240 160,330 230,420 C300,520 360,600 420,700 C470,780 520,900 560,1090 Z" fill="#0B1418"/>
    <path d="M${X1 + 20},1090 L${X1 + 20},140 C2200,160 2000,180 1940,160 C1820,200 1720,300 1660,420 C1600,540 1560,660 1520,780 C1490,880 1470,980 1460,1090Z" fill="#0B1418"/>
    <path d="M${X0 - 20},1090 L${X0 - 20},420 C-200,400 -60,440 0,440 C60,440 140,500 200,580 C260,660 300,760 330,1090Z" fill="#11201F"/>`);
  else add('back', `<path d="M-20,2410 L-20,1100 C60,1140 140,1260 200,1400 C260,1540 300,1700 330,2410 Z" fill="#0B1418"/>
    <path d="M1100,2410 L1100,1000 C1020,1060 960,1200 920,1360 C880,1520 860,1700 840,2410Z" fill="#0B1418"/>`);
  add('back', `<rect x="${X0}" y="${PC ? 560 : 1300}" width="${X1 - X0}" height="${PC ? 160 : 200}" fill="url(#mist)" opacity=".6"/>`);
  add('under', `<rect class="mist" x="${X0 - 200}" y="${PC ? 640 : 1500}" width="${X1 - X0 + 400}" height="${PC ? 140 : 220}" fill="url(#mist)" opacity=".5"/>`);
  // the knoll the grove stands on
  if (PC) add('mid', `<path d="M440,1090 C520,960 640,905 800,890 C900,880 960,872 1020,872 C1100,872 1200,880 1320,892 C1440,904 1520,960 1580,1090Z" fill="url(#knoll)"/>
    <path d="M560,940 C660,905 760,893 860,886 M1180,884 C1300,892 1400,906 1480,940" stroke="${S === 'winter' ? '#F2F7F8' : '#5E8F87'}" stroke-width="2.5" fill="none" opacity=".6" stroke-linecap="round"/>`);
  else add('mid', `<path d="M60,2410 C120,2060 260,1930 420,1906 C480,1898 540,1894 600,1896 C700,1900 820,1930 900,2010 C960,2080 990,2200 1010,2410Z" fill="url(#knoll)"/>
    <path d="M160,2050 C240,1960 340,1918 440,1906 M640,1898 C760,1910 860,1950 920,2030" stroke="${S === 'winter' ? '#F2F7F8' : '#5E8F87'}" stroke-width="3" fill="none" opacity=".6" stroke-linecap="round"/>`);
  const rt = rng(31);

      <path d="M${x - w},${base} C${x - w * .6},${base - h * .5} ${x - w * .3},${base - h * .8} ${x},${base - h} C${x + w * .3},${base - h * .8} ${x + w * .6},${base - h * .5} ${x + w},${base}Z" fill="#C9D8DC"/>

  for (let i = 0; i < 18; i++) { const x = PC ? 640 + r() * 760 : 200 + r() * 700, y = PC ? 900 + r() * 120 : 1950 + r() * 200; add('moving', `<circle class="rise" style="animation-duration:${f1(9 + r() * 8)}s;animation-delay:-${f1(r() * 16)}s" cx="${f1(x)}" cy="${f1(y)}" r="2" fill="#DCEBF0"/>`); }
  if (PC) add('mid', `<path d="M560,1090 C700,1010 900,990 1100,996 S1420,1030 1460,1090Z" fill="#132A30" opacity=".85"/>`);
  // (winter: the knoll's own colours turn snowy)
  grain('mid', .45);
  return { ink: ['#E6ECEE', '#B9C6CA', '#7D898D'], shadow: true };
}

    <text x="${x}" y="${y + 178}" font-family="Cormorant Garamond,serif" font-style="italic" font-size="34" fill="${c2}">Second breakfast</text>
    <text x="${x}" y="${y + 212}" font-size="19" fill="${c3}">10 Blotmath · Saturday 31 October</text></g>`;
  else L.clock = `<g text-anchor="middle"><text x="540" y="300" font-family="Alegreya Sans,sans-serif" font-size="40" fill="${c3}">Sat 31 Oct</text>
    <text x="540" y="560" font-family="Fraunces,serif" font-size="300" fill="${c1}"><tspan font-weight="800">10</tspan><tspan dx="30" font-weight="300" fill="${c2}">14</tspan></text>
    <text x="540" y="660" font-family="Cormorant Garamond,serif" font-style="italic" font-size="58" fill="${c2}">Sterday · 10 Blotmath</text>
    <text x="540" y="740" font-family="Cormorant Garamond,serif" font-style="italic" font-size="52" fill="${c3}">Second breakfast</text></g>`;
}
let body = `<defs>${L.defs}</defs>`;
if (LAYER) body += L[LAYER] || '';
else body += L.back + L.under + L.mid + L.moving + L.front + L.over + (L.clock || '');
svg.innerHTML = body;
document.title = `Lembas — ${THEME}`;
window.LEMBAS_READY = document.fonts ? document.fonts.ready.then(() => true) : Promise.resolve(true);
</script>
</body>
</html>
