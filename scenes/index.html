<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lembas scenes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Alegreya+Sans:wght@500&display=swap" rel="stylesheet">
<style>
/* Lembas — the four Middle-earth scenes, shared by every Lembas device.
   One drawing, two shapes: fmt=pc (a 2880×1080 panorama; a 16:9 screen shows the middle
   1920, an ultrawide shows more) and fmt=phone (1080×2400, for a tall screen).
   ?theme=shire|redbook|starlit|elven   ?season=spring|summer|autumn|winter (default: today's)
   ?south=0|1 (hemisphere, default 1)   ?fmt=pc|phone   ?clock=1 (a preview clock)
   ?still=1 (no motion)   ?layer=back|mid|front|moving (the still layers the apps animate between)
   Open it in a browser, or use it as a Lively Wallpaper: it animates on its own. */
html,body{margin:0;height:100%;overflow:hidden;background:#05070F}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
html.transparent,html.transparent body{background:transparent}
.still *{animation:none!important}
.still .fall,.still .rise,.still .ember{display:none}
/* motion, for the browser version (the apps draw the same motion themselves) */
.drift{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-700px)}to{transform:translateX(3200px)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 5s ease-out infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.6}100%{transform:translate(50px,-200px) scale(1.9);opacity:0}}
.glint{animation:glint ease-in-out infinite}
@keyframes glint{0%,100%{opacity:0;transform:translateX(-14px)}50%{opacity:.85;transform:translateX(14px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite}
.flame.b{animation-duration:1.05s;animation-delay:-.4s}.flame.c{animation-duration:.8s;animation-delay:-.2s}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(.94,1.08) skewX(-3deg)}50%{transform:scale(1.04,.93) skewX(2deg)}75%{transform:scale(.97,1.05) skewX(-1deg)}}
.ember{animation:ember linear infinite}
@keyframes ember{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(30px,-260px);opacity:0}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
.flicker{animation:flicker 3.2s steps(1) infinite}
@keyframes flicker{0%,100%{opacity:1}31%{opacity:.82}33%{opacity:1}64%{opacity:.88}67%{opacity:1}}
.fall{animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-120px);opacity:0}20%{opacity:.9}to{transform:translateY(520px);opacity:0}}
.lamp{transform-box:fill-box;transform-origin:center;animation:lamp ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.6;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.rise{animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-360px);opacity:0}}
.mist{animation:mist 40s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
.needle{transform-box:fill-box;transform-origin:center;animation:needle 7s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}
.clock{font-family:'Fraunces',serif}
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const FMT = q.get('fmt') === 'phone' ? 'phone' : 'pc';
const SOUTH = q.get('south') !== '0';
function seasonToday() {
  const m = new Date().getMonth(); // 0..11
  const north = ['winter','winter','spring','spring','spring','summer','summer','summer','autumn','autumn','autumn','winter'][m];
  const flip = { winter:'summer', summer:'winter', spring:'autumn', autumn:'spring' };
  return SOUTH ? flip[north] : north;
}
const SEASON = q.get('season') || seasonToday();
const THEME = q.get('theme') || 'shire';
const LAYER = q.get('layer');       // only this still layer (transparent elsewhere)
const STILL = q.has('still');
const CLOCK = q.get('clock') === '1';
if (STILL) document.body.classList.add('still');
if (LAYER && LAYER !== 'back') document.documentElement.classList.add('transparent');

// The drawing area. PC: the 1920×1080 design, with 480 more on each side for wide screens.
const PC = FMT === 'pc';
const W = PC ? 1920 : 1080, H = PC ? 1080 : 2400;
const X0 = PC ? -480 : 0, X1 = PC ? 2400 : 1080;
const svg = document.getElementById('art');
svg.setAttribute('viewBox', `${X0} 0 ${X1 - X0} ${H}`);
svg.setAttribute('preserveAspectRatio', 'xMidYMax slice');

// Still layers: back (sky and far land), mid (in front of the clouds and sun), front (the
// foreground). Moving parts, which the apps animate themselves (drawn here for the browser), sit
// at three depths: under (behind mid), moving (between mid and front) and over (above it all).
const L = { defs: '', back: '', under: '', mid: '', moving: '', front: '', over: '' };
const add = (layer, s) => { L[layer] += s; };
const def = s => { L.defs += s; };

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const f1 = v => (Math.round(v * 10) / 10);
function hill(base, amp, seed, bottom = H + 10) {
  const r = rng(seed);
  const k = [...Array(4)].map((_, i) => ({ f: (0.6 + r() * 1.4) * (i + 1) / W * Math.PI * 2, p: r() * 7, a: amp / (i + 1.2) }));
  let d = `M${X0 - 20},${bottom}`;
  for (let x = X0 - 20; x <= X1 + 20; x += 12) { let y = base; for (const c of k) y += Math.sin(x * c.f + c.p) * c.a; d += ` L${x},${f1(y)}`; }
  return d + ` L${X1 + 20},${bottom} Z`;
}
/** The height of hill(base, amp, seed) at x, to sit things exactly on its crest. */
function hillY(base, amp, seed, x) {
  const r = rng(seed);
  const k = [...Array(4)].map((_, i) => ({ f: (0.6 + r() * 1.4) * (i + 1) / W * Math.PI * 2, p: r() * 7, a: amp / (i + 1.2) }));
  let y = base; for (const c of k) y += Math.sin(x * c.f + c.p) * c.a; return y;
}
function mountains(base, amp, seed, rough, peaks) {
  const r = rng(seed), n = 257, ys = new Array(n).fill(0);
  ys[0] = r() * amp; ys[n - 1] = r() * amp;
  let step = n - 1, sc = amp;
  while (step > 1) { for (let i = 0; i + step < n; i += step) { const m = i + step / 2; ys[m] = (ys[i] + ys[i + step]) / 2 + (r() - 0.5) * sc * 2; } step /= 2; sc *= rough; }
  const span = X1 - X0 + 40;
  for (const [px, ph, pw] of peaks) for (let i = 0; i < n; i++) { const x = X0 - 20 + i / (n - 1) * span; ys[i] += ph * Math.max(0, 1 - Math.abs(x - px) / pw); }
  let d = `M${X0 - 20},${H + 10} `;
  ys.forEach((v, i) => { d += `L${f1(X0 - 20 + i / (n - 1) * span)},${f1(base - v)} `; });
  return d + `L${X1 + 20},${H + 10} Z`;
}
const grainDef = `<filter id="grain" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 .07 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>`;
// film grain goes on the back layer only, so the see-through layers stay small and clean
const grain = (layer, o) => add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" filter="url(#grain)" opacity="${o}"/>`);
const at = (x, y, s, body) => `<g transform="translate(${x},${y}) scale(${s})">${body}</g>`;

// ---- depth: colours, gradients and light shared by the scenes
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => '#' + hex(a).map((v, i) => Math.round(v + (hex(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
let gid = 0;
/** A top-to-bottom gradient (over the shape's own height): paler and hazier at the crest, deeper below. */
function vg(top, bottom, mid) {
  const id = 'v' + (gid++);
  def(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/>${mid ? `<stop offset="${mid[1]}" stop-color="${mid[0]}"/>` : ''}<stop offset="1" stop-color="${bottom}"/></linearGradient>`);
  return `url(#${id})`;
}
/** Light falling from a point (the sun, the moon, a lamp): a radial paint in scene units. */
function lightFrom(x, y, r, color, o = 1) {
  const id = 'l' + (gid++);
  def(`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${x}" cy="${y}" r="${r}"><stop offset="0" stop-color="${color}" stop-opacity="${o}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient>`);
  return `url(#${id})`;
}
/** A land layer: its gradient fill, and a thin lit edge on the side facing the light. */
const land = (layer, d, top, bottom, rim) => add(layer, `<path d="${d}" fill="${vg(top, bottom)}"/>` + (rim ? `<path d="${d}" fill="none" stroke="${rim}" stroke-width="${PC ? 1.6 : 2.2}" opacity=".7"/>` : ''));
/** A band of haze at the foot of a far layer, so nearer land stands in front of it. */
const haze = (layer, y, h, color, o) => { const id = 'h' + (gid++); def(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0"/><stop offset="1" stop-color="${color}" stop-opacity="${o}"/></linearGradient>`); add(layer, `<rect x="${X0}" y="${y}" width="${X1 - X0}" height="${h}" fill="url(#${id})"/>`); };
/** A soft darkening at the edges, so the eye settles in the middle. */
const vignette = (color, o) => { def(`<radialGradient id="vig" cx=".5" cy=".55" r=".75"><stop offset=".55" stop-color="${color}" stop-opacity="0"/><stop offset="1" stop-color="${color}" stop-opacity="${o}"/></radialGradient>`); add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" fill="url(#vig)"/>`); };

// Where things sit, per format (x, y, scale), so the apps can place the moving parts too.
const P = PC ? {
  sun: [1390, 250, 1], tree: [470, 600, 1], farTree: [1660, 520, .45], nearTree: [60, 900, 1.6], door: [1240, 905, 1], chimney: [1389, 826], river: 760,
  clouds: [[1640, 190, 1, .9, 260], [980, 140, .7, .75, 320], [1240, 420, .55, .8, 380], [320, 470, .6, .7, 300], [-260, 260, .8, .8, 340]],
  glints: [[140, 775, 70], [520, 792, 40], [1010, 771, 90], [1560, 752, 50], [-300, 768, 60], [2100, 770, 70]],
  fire: [1210, 820, 1], compass: [1760, 900, 1], moon: [1480, 230, 54], lakeY: 790, glint: [1480, 812],
  cabin: [600, 905], star: [1160, 150, 1], clock: [150, 150],
} : {
  // the phone: the clock and the sun's arc sit in the top 1000; the land rises to meet them
  sun: [820, 1060, 1], tree: [220, 1330, 1.25], farTree: [880, 1176, .5], nearTree: [40, 2010, 2.1], door: [740, 1850, 1.6], chimney: [893, 1706], river: 1500,
  clouds: [[160, 1100, .85, .85, 220], [930, 1150, .62, .8, 280], [470, 1210, .45, .7, 340]],
  glints: [[120, 1512, 60], [560, 1530, 40], [900, 1478, 50]],
  fire: [560, 1700, 1.4], compass: [900, 1900, 1], moon: [820, 960, 64], lakeY: 1760, glint: [820, 1786],
  cabin: [430, 1960], star: [540, 140, 1.2], clock: [540, 300],
};

// ================================================================ Shire Morning
function shire() {
  const S = SEASON;
  const pal = {
    spring: { hills: ['#C9DDB3', '#AFCD96', '#93BC7C', '#79A866', '#6E9C55', '#4F8043'], tree: ['#7DAE5E', '#93BF72', '#F2B8C6'], flowers: ['#F4B6C7', '#FFFFFF', '#D6C38A', '#D98BB0'], sky: ['#C3E3E2', '#E9F0DF', '#F3EDDF'] },
    summer: { hills: ['#C3D7AE', '#A9C793', '#8DB677', '#79A35F', '#6E9A56', '#4E7E42'], tree: ['#6A9850', '#7DAA5F', '#86B266'], flowers: ['#F0A27E', '#D6C38A', '#FFFFFF', '#D98BB0'], sky: ['#BFE0E0', '#E7EEDD', '#F3EBDB'] },
    autumn: { hills: ['#CAC8AE', '#C3BE84', '#A9AE6A', '#9A9C58', '#8D8C4E', '#6E7440'], tree: ['#D9843A', '#E8A646', '#C8562E'], flowers: ['#E8A646', '#C8562E', '#D6C38A', '#B8743A'], sky: ['#CFE0DE', '#EAE6DC', '#EEE1CF'] },
    winter: { hills: ['#E9EEF0', '#DCE6E8', '#CCDADB', '#BACDCC', '#AFC4C2', '#8FA9A6'], tree: ['#C7D6D6', '#E6EEEF', '#FFFFFF'], flowers: ['#FFFFFF', '#FFFFFF', '#E9F2F4', '#FFFFFF'], sky: ['#C6D8E4', '#E4EAF0', '#F0EEE9'] },
  }[S];
  const hl = pal.hills, sky2 = pal.sky[2];
  def(`${grainDef}<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pal.sky[0]}"/><stop offset="${PC ? .45 : .35}" stop-color="${pal.sky[1]}"/><stop offset="${PC ? .72 : .52}" stop-color="${pal.sky[2]}"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#FFF6D8"/><stop offset=".28" stop-color="#FFEFC0"/><stop offset=".29" stop-color="#FFE7A6" stop-opacity=".55"/><stop offset="1" stop-color="#FFE7A6" stop-opacity="0"/></radialGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${S === 'winter' ? '#DDEBEE' : '#CFE7E4'}"/><stop offset=".5" stop-color="${S === 'winter' ? '#E8F2F4' : '#DDF0EC'}"/><stop offset="1" stop-color="${S === 'winter' ? '#BFD8DE' : '#A9D3D3'}"/></linearGradient>
  <radialGradient id="door" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#3E8657"/><stop offset="1" stop-color="#22522F"/></radialGradient>
  <radialGradient id="lantern"><stop offset="0" stop-color="#FFE6A8" stop-opacity=".6"/><stop offset="1" stop-color="#FFE6A8" stop-opacity="0"/></radialGradient>`);
  add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" fill="url(#sky)"/>`);
  const [sx, sy] = P.sun;
  // the morning light along the horizon, under the sun
  add('back', `<rect x="${X0}" y="0" width="${X1 - X0}" height="${H}" fill="${lightFrom(sx, sy, PC ? 1100 : 900, '#FFF1CC', .55)}"/>`);
  // sun and clouds move (drawn by the apps); here for the browser
  add('under', `<circle class="pulse" cx="${sx}" cy="${sy}" r="300" fill="url(#sun)"/>`);
  const cloud = (x, y, s, o, dur) => add('under', `<g class="drift" style="animation-duration:${dur}s;animation-delay:-${(x + 700) / 3900 * dur}s"><g transform="translate(${x},${y}) scale(${s})" fill="#fff" opacity="${o}"><rect x="-90" y="-8" width="200" height="34" rx="17"/><circle cx="-30" cy="-6" r="32"/><circle cx="20" cy="-22" r="42"/><circle cx="66" cy="-2" r="26"/></g></g>`);
  for (const [x, y, sc, o, d] of P.clouds) cloud(x, y, sc, o, d);
  const b = PC ? 0 : 680;  // the phone's land starts lower
  const rimSun = lightFrom(sx, sy, PC ? 1300 : 1000, '#FFFBEA', .75);
  // far away: a blue-green ridge in the haze, with a few far trees
  const far = mix(hl[0], pal.sky[0], .45);
  land('mid', hill(500 + b, PC ? 18 : 22, 41), mix(far, sky2, .25), far);
  if (S !== 'winter') { const rf = rng(17), fc = mix(far, hl[5], .16); for (let i = 0; i < (PC ? 22 : 9); i++) {   // far copses, sitting on the ridge
    const x = X0 + rf() * (X1 - X0), y = hillY(500 + b, PC ? 18 : 22, 41, x) + 3, s0 = (PC ? .8 : 1) * (.7 + rf() * .5);
    add('mid', `<g fill="${fc}" opacity=".75"><circle cx="${f1(x - 8 * s0)}" cy="${f1(y - 6 * s0)}" r="${f1(7 * s0)}"/><circle cx="${f1(x + 4 * s0)}" cy="${f1(y - 10 * s0)}" r="${f1(9 * s0)}"/><circle cx="${f1(x + 14 * s0)}" cy="${f1(y - 5 * s0)}" r="${f1(6 * s0)}"/></g>`); } }
  haze('mid', 440 + b, 120, sky2, .7);
  land('mid', hill(560 + b, PC ? 22 : 26, 3), mix(hl[0], '#FFFFFF', .15), hl[0], rimSun);
  haze('mid', 520 + b, 120, sky2, .55);
  land('mid', hill(610 + b, PC ? 28 : 30, 9), mix(hl[1], '#FFFFFF', .12), mix(hl[1], hl[2], .5), rimSun);
  land('mid', hill(660 + b, 34, 21), mix(hl[2], '#FFFFFF', .1), mix(hl[2], hl[3], .6), rimSun);
  if (S === 'winter') add('mid', `<path d="${hill(566 + b, PC ? 22 : 26, 3)}" fill="#FFFFFF" opacity=".5"/>`);
  // trees at three distances: a small one on the far hills, the Party Tree, a big one up close
  const treeAt = (layer, x, y, s, tc, trunk, sway) => add(layer, at(x, y, s, `<g${sway ? ' class="sway"' : ''}><path d="M-6,44 C-5,20 -4,0 -3,-20 L3,-20 C4,0 5,20 7,44 Z" fill="${trunk}"/><path d="M-2,-6 L-22,-34 M1,-14 L20,-40" stroke="${trunk}" stroke-width="4" stroke-linecap="round"/>` +
    (S === 'winter'
      ? `<path d="M0,-10 L-30,-70 M0,-30 L28,-84 M0,-50 L-8,-104 M-18,-46 L-48,-60 M16,-60 L44,-58" stroke="${trunk}" stroke-width="5" stroke-linecap="round"/><g fill="#FFFFFF" opacity=".9"><circle cx="-30" cy="-72" r="6"/><circle cx="28" cy="-86" r="6"/><circle cx="-8" cy="-106" r="6"/><circle cx="44" cy="-60" r="5"/><circle cx="-48" cy="-62" r="5"/></g>`
      : `<g fill="${vg(mix(tc[1], '#FFFFFF', .12), tc[0])}"><circle cx="-44" cy="-30" r="34"/><circle cx="46" cy="-32" r="38"/><circle cx="0" cy="-58" r="52"/></g><circle cx="10" cy="-78" r="34" fill="${mix(tc[1], '#FFF6D8', .18)}"/><circle cx="-22" cy="-62" r="22" fill="${tc[2]}"/><path d="M-60,-20 C-30,0 30,2 70,-22 C60,-4 30,6 0,6 C-30,6 -54,-4 -60,-20Z" fill="#000" opacity=".08"/>` +
        (S === 'spring' ? [...Array(16)].map((_, i) => { const r = rng(90 + i); return `<circle cx="${f1(-60 + r() * 120)}" cy="${f1(-110 + r() * 90)}" r="${f1(3 + r() * 3)}" fill="${i % 2 ? '#F2B8C6' : '#FFFFFF'}"/>`; }).join('') : '')) + `</g>`));
  const [tx, ty, ts] = P.tree;
  treeAt('mid', P.farTree[0], P.farTree[1], P.farTree[2], pal.tree.map(c => mix(c, far, .45)), mix('#5B4A33', far, .45), false);
  treeAt('mid', tx, ty, ts, pal.tree, '#5B4A33', true);
  // the river, with a lighter middle where it catches the sky
  const rv = P.river;
  add('mid', PC
    ? `<path d="M${X0 - 20},${rv} C300,720 520,800 820,770 S1300,700 1500,735 S1800,790 ${X1 + 20},${rv} L${X1 + 20},${rv + 30} C1700,820 1520,770 1300,770 S860,830 600,820 S200,770 ${X0 - 20},${rv + 40} Z" fill="url(#river)"/>`
    : `<path d="M-20,${rv} C200,${rv - 40} 420,${rv + 40} 640,${rv + 10} S960,${rv - 60} 1100,${rv - 20} L1100,${rv + 20} C940,${rv - 10} 820,${rv + 50} 640,${rv + 50} S220,${rv + 10} -20,${rv + 40} Z" fill="url(#river)"/>`);
  P.glints.forEach(([x, y, w], i) => add('moving', `<path class="glint" style="animation-duration:${4 + i % 3}s;animation-delay:-${i * 1.3}s" d="M${x},${y} h${w}" stroke="#fff" stroke-width="${PC ? 3 : 4}" stroke-linecap="round"/>`));
  // the hill with the round doors, lit from the sun's side
  const hillA = PC ? `M820,1090 C900,860 1080,790 1320,790 C1560,790 1760,850 ${X1 + 20},900 L${X1 + 20},1090 Z` : `M260,2410 C320,1850 520,1690 760,1680 C900,1674 1020,1710 1100,1750 L1100,2410 Z`;
  const hillB = PC ? `M${X0 - 20},1090 L${X0 - 20},870 C-200,860 0,850 200,850 C420,860 640,900 760,925 C860,980 900,1090 900,1090 Z` : `M-20,2410 L-20,1820 C120,1780 260,1800 380,1860 C460,1900 520,2000 540,2410 Z`;
  land('front', hillA, mix(hl[4], '#FFFFFF', .1), mix(hl[4], hl[5], .55), rimSun);
  land('front', hillB, mix(hl[3], '#FFFFFF', .08), mix(hl[3], hl[5], .5), rimSun);
  const door = (x, y, r, c, win, main) => {
    const stones = main ? [...Array(14)].map((_, i) => { const a0 = i / 14 * Math.PI * 2, a1 = a0 + Math.PI * 2 / 14 - .05, R = r * 1.2, R2 = r * 1.02;

      `${main ? [...Array(7)].map((_, i) => `<path d="M${f1(x - r + (i + 1) * r / 4)},${f1(y - Math.sqrt(Math.max(0, r * r - Math.pow(-r + (i + 1) * r / 4 - 0, 2))))} V${f1(y + Math.sqrt(Math.max(0, r * r - Math.pow(-r + (i + 1) * r / 4, 2))))}" stroke="#000" stroke-opacity=".1" stroke-width="${f1(r / 28)}"/>`).join('') : `<path d="M${x - r},${y} h${2 * r} M${x},${y - r} v${2 * r}" stroke="#000" stroke-opacity=".12" stroke-width="${r / 20}"/>`}` +
      `<circle cx="${x}" cy="${y}" r="${r * 0.12}" fill="#E8B84A"/><circle cx="${x - r * .03}" cy="${y - r * .03}" r="${r * 0.05}" fill="#FFF0C0"/>`);

      (main ? `<path d="M${x + win - r * .5},${y + r * .22} h${r} v${r * .1} h-${r}z" fill="#9A7A52"/>${[0, 1, 2, 3].map(k => `<circle cx="${f1(x + win - r * .38 + k * r * .25)}" cy="${f1(y + r * .16)}" r="${f1(r * .09)}" fill="${pal.flowers[k % 4]}"/>`).join('')}` : ''));

  for (let k = 0; k < 4; k++) add('over', STILL

  add('front', `<path d="${path}" stroke="#BFB194" stroke-width="${PC ? 30 : 42}" fill="none" stroke-linecap="round"/><path d="${path}" stroke="#DCD0B4" stroke-width="${PC ? 20 : 28}" fill="none" stroke-linecap="round"/>`);
  const fence = PC ? [1300, 1006, 1480, 980, 9] : [800, 1990, 1080, 1960, 8];
  { const [x0f, y0f, x1f, y1f, n] = fence, post = PC ? 30 : 42;
    let f = `<path d="M${x0f},${y0f - post * .55} L${x1f},${y1f - post * .55} M${x0f},${y0f - post * .25} L${x1f},${y1f - post * .25}" stroke="#8C6F4C" stroke-width="${PC ? 4 : 5}"/>`;
    for (let i = 0; i <= n; i++) { const x = x0f + (x1f - x0f) * i / n, y = y0f + (y1f - y0f) * i / n; f += `<path d="M${f1(x - 3)},${f1(y)} V${f1(y - post)} l3,-5 l3,5 V${f1(y)}Z" fill="#9A7B55"/>`; }

  const r = rng(5), n = S === 'spring' ? 90 : S === 'winter' ? 0 : 56;

  }
  if (S === 'autumn') for (let i = 0; i < 40; i++) { const x = f1(X0 + r() * (X1 - X0)), y = f1(PC ? 960 + r() * 110 : 1900 + r() * 200); add('front', `<ellipse cx="${x}" cy="${y}" rx="6" ry="3" fill="${pal.tree[i % 3]}" transform="rotate(${f1(r() * 180)} ${x} ${y})"/>`); }
  // up close: a big tree at the edge, and the grass

  land('front', hill(PC ? 1030 : 2060, 14, 77), hl[5], mix(hl[5], '#1E3A22', .35));
  if (S !== 'winter') for (let i = 0; i < (PC ? 160 : 60); i++) { const x = X0 + r() * (X1 - X0), h = 14 + r() * 26, y0 = PC ? 1040 : 2072; add('front', `<path d="M${f1(x)},${y0} q3,-${f1(h)} 7,-${f1(h + 4)} q-1,${f1(h * 0.6)} 2,${f1(h + 4)}z" fill="${S === 'autumn' ? '#7E7A3E' : '#456F3A'}"/>`); }
  vignette('#3A4A2A', .14);
  grain('front', .9);

}

  else { for (let i = 0; i < 34; i++) tree(900 + r() * 170, 900 + r() * 700, 9 + r() * 6); for (let i = 0; i < 16; i++) tree(80 + r() * 260, 1780 + r() * 240, 8 + r() * 5); }
  add('back', `</g>`);
  const nm = (x, y, t, s, ital = false, rot = 0) => add('back', `<text x="${x}" y="${y}" font-family="IM Fell English,serif" font-size="${s}" fill="${ink}" ${ital ? 'font-style="italic"' : ''} text-anchor="middle" transform="rotate(${rot} ${x} ${y})" opacity=".85" filter="url(#rough)">${t}</text>`);
  if (PC) { nm(330, 500, 'Hobbiton', 30); nm(760, 640, 'Bywater', 24); nm(1770, 120, 'The Old Forest', 30, true); nm(1440, 470, 'Brandywine', 22, true, -72); nm(980, 840, 'Green Hill Country', 22, true); nm(330, 1000, 'Woody End', 22, true); nm(-280, 500, 'Michel Delving', 24); nm(-270, 900, 'The White Downs', 20, true); }

// ================================================================ Starlit Night
function starlit() {
  const S = SEASON;
  def(`${grainDef}<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B1C"/><stop offset="${PC ? .55 : .5}" stop-color="#14204A"/><stop offset="${PC ? .82 : .72}" stop-color="#3A3F72"/></linearGradient>

    <text x="${x}" y="${y + 212}" font-size="19" fill="${c3}">10 Blotmath · Saturday 31 October</text></g>`;
  else L.clock = `<g text-anchor="middle"><text x="540" y="300" font-family="Alegreya Sans,sans-serif" font-size="40" fill="${c3}">Sat 31 Oct</text>
    <text x="540" y="560" font-family="Fraunces,serif" font-size="300" fill="${c1}"><tspan font-weight="800">10</tspan><tspan dx="30" font-weight="300" fill="${c2}">14</tspan></text>
    <text x="540" y="660" font-family="Cormorant Garamond,serif" font-style="italic" font-size="58" fill="${c2}">Sterday · 10 Blotmath</text>
    <text x="540" y="740" font-family="Cormorant Garamond,serif" font-style="italic" font-size="52" fill="${c3}">Second breakfast</text></g>`;
}
let body = `<defs>${L.defs}</defs>`;
if (LAYER) body += L[LAYER] || '';
else body += L.back + L.under + L.mid + L.moving + L.front + L.over + (L.clock || '');
svg.innerHTML = body;
document.title = `Lembas — ${THEME}`;
window.LEMBAS_READY = document.fonts ? document.fonts.ready.then(() => true) : Promise.resolve(true);
</script>
</body>
